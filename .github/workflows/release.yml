name: Release - Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to release (for example v2.0.0)
        required: true
        type: string

permissions: {}

jobs:
  validation-gate:
    name: Release validation gate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - name: Ensure Tag is on main
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_SHA="${GITHUB_SHA}"
          else
            # Resolve annotated tag target first; fallback supports lightweight tags.
            TAG_SHA="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}' | head -n1)"
            if [[ -z "$TAG_SHA" ]]; then
              TAG_SHA="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}' | head -n1)"
            fi
          fi

          if [[ -z "$TAG_SHA" ]]; then
            echo "Could not resolve tag commit for $RELEASE_TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Tag is not on main branch"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Validate tag, changelog cut, and version alignment
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)?$ ]]; then
            echo "Tag must be semantic version style, got: $RELEASE_TAG"
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          echo "Validating release cut for ${RELEASE_VERSION}"

          if ! grep -q "^## \[${RELEASE_VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing a cut for ${RELEASE_VERSION}"
            exit 1
          fi

          if ! grep -q "^## \[Unreleased\]" CHANGELOG.md; then
            echo "CHANGELOG.md must keep an Unreleased section"
            exit 1
          fi

          unreleased_line="$(grep -n "^## \[Unreleased\]" CHANGELOG.md | head -n1 | cut -d: -f1)"
          release_line="$(grep -n "^## \[${RELEASE_VERSION}\]" CHANGELOG.md | head -n1 | cut -d: -f1)"

          if [[ -z "$unreleased_line" || -z "$release_line" || "$unreleased_line" -ge "$release_line" ]]; then
            echo "Unreleased must appear before the current release section"
            exit 1
          fi

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          release_tag = os.environ["RELEASE_TAG"]
          release_version = release_tag[1:]
          init_text = Path("src/vulnparse_pin/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          if not match:
              raise SystemExit("Could not find __version__ in src/vulnparse_pin/__init__.py")
          package_version = match.group(1)
          if package_version != release_version:
              raise SystemExit(
                  f"Version mismatch: tag={release_version} package={package_version}"
              )
          print(f"Version alignment OK: {package_version}")
          PY

  test-matrix:
    name: Release Test Matrix (Python ${{ matrix.python-version }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: validation-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with test and UI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: Run full test suite
        # Exclude 3 pre-existing missing untracked JSON fixtures in repo baseline
        run: pytest -q --ignore=tests/test_aci_phrase_benchmark.py -k "not TestOpenVASXMLExpanded"

  build:
    name: Build Python distributions
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [validation-gate, test-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1.2.2"

      - name: Build sdist and wheel
        run: |
          rm -rf dist build ./*.egg-info src/*.egg-info
          python -m build --sdist --wheel

      - name: Verify PEP 639 wheel metadata
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected 1 wheel in dist/, found {wheels}")

          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              metadata_files = [n for n in names if n.endswith(".dist-info/METADATA")]
              if len(metadata_files) != 1:
                  raise SystemExit(f"Expected 1 METADATA in wheel, found {metadata_files}")
              metadata = zf.read(metadata_files[0]).decode("utf-8").splitlines()
              if "License-Expression: Apache-2.0" not in metadata:
                  raise SystemExit("Wheel METADATA missing 'License-Expression: Apache-2.0'")
              for req_file in ("LICENSE", "NOTICE"):
                  if f"License-File: {req_file}" not in metadata:
                      raise SystemExit(f"Wheel METADATA missing 'License-File: {req_file}'")
                  if not any(n.endswith(f".dist-info/licenses/{req_file}") for n in names):
                      raise SystemExit(f"Wheel missing .dist-info/licenses/{req_file}")
              if not any(n.endswith("vulnparse_pin/py.typed") for n in names):
                  raise SystemExit("Wheel missing vulnparse_pin/py.typed")
          PY

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  finalize-release:
    name: Generate SBOM, attest provenance, checksums, and publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8.0.0
        with:
          name: python-dist
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Generate CycloneDX SBOM from built wheel in isolated runtime venv
        run: |
          python -m venv /tmp/sbom-tool-venv
          /tmp/sbom-tool-venv/bin/python -m pip install --upgrade pip
          /tmp/sbom-tool-venv/bin/pip install "cyclonedx-bom>=7.3.0"
          python -m venv /tmp/runtime-venv
          /tmp/runtime-venv/bin/python -m pip install --upgrade pip
          /tmp/runtime-venv/bin/pip install "dist/"*.whl"[ui]"
          /tmp/sbom-tool-venv/bin/cyclonedx-py environment /tmp/runtime-venv/bin/python --of JSON > dist/vulnparse-pin-sbom.json
          /tmp/sbom-tool-venv/bin/python - <<'PY'
          import json
          import re
          from pathlib import Path

          forbidden_re = re.compile(r"(agpl|lgpl|gpl|affero)", re.IGNORECASE)
          sbom = json.loads(Path("dist/vulnparse-pin-sbom.json").read_text(encoding="utf-8"))
          components = list(sbom.get("components", []))
          root_comp = sbom.get("metadata", {}).get("component")
          if root_comp:
              components.append(root_comp)

          saw_vpp = False
          for comp in components:
              name = comp.get("name", "")
              serialized = json.dumps(comp.get("licenses", []))
              if forbidden_re.search(serialized):
                  raise SystemExit(f"Forbidden copyleft license in SBOM for {name}: {serialized}")
              if name.lower() == "vulnparse-pin":
                  saw_vpp = True
                  if "Apache-2.0" not in serialized:
                      raise SystemExit(f"Expected Apache-2.0 for VulnParse-Pin, got {serialized}")
          if not saw_vpp:
              raise SystemExit("VulnParse-Pin missing from release SBOM")
          PY

      - name: Install GPG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnupg

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          find . -type f \
          ! -name "SHA256SUMS" \
          ! -name "*.asc" \
          -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Import GPG Key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          printf '%b' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign SHA256SUMS
        if: env.GPG_PRIVATE_KEY != '' && env.GPG_PASSPHRASE != ''
        working-directory: dist
        run: |
          gpg --batch --yes \
          --pinentry-mode loopback \
          --passphrase "$GPG_PASSPHRASE" \
          --armor --detach-sign SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2.4.0
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          make_latest: "true"
          files: |
            dist/*

  publish-pypi:
    name: Publish Python distributions to PyPI
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8.0.0
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1.13
        with:
          skip-existing: true
          verbose: true

  publish-ghcr:
    name: Build and publish multi-arch OCI image to GHCR
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [validation-gate, test-matrix, build]
    runs-on: ubuntu-latest
    environment:
      name: Production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - name: Derive OCI image name and release tags
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          TAGS_FILE="$(mktemp)"
          printf '%s:%s\n%s:v%s\n' "$IMAGE_NAME" "$RELEASE_VERSION" "$IMAGE_NAME" "$RELEASE_VERSION" > "$TAGS_FILE"
          if [[ "$RELEASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            printf '%s:%s.%s\n%s:%s\n%s:latest\n' \
              "$IMAGE_NAME" "$MAJOR" "$MINOR" \
              "$IMAGE_NAME" "$MAJOR" \
              "$IMAGE_NAME" >> "$TAGS_FILE"
          fi
          {
            echo "image_name=${IMAGE_NAME}"
            echo "version=${RELEASE_VERSION}"
            echo "tags<<EOF"
            cat "$TAGS_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm -f "$TAGS_FILE"

      - name: Smoke-test container under --read-only rootfs before publishing
        run: |
          set -euo pipefail
          docker build -t "vpp-smoke:${{ steps.meta.outputs.version }}" --build-arg "VPP_VERSION=${{ steps.meta.outputs.version }}" .
          TMP_WORK="$(mktemp -d)"
          TMP_CACHE="$(mktemp -d)"
          mkdir -p "${TMP_CACHE}/data" "${TMP_CACHE}/config" "${TMP_CACHE}/xdg"
          sudo chown -R 10001:10001 "$TMP_WORK" "$TMP_CACHE"
          trap 'sudo rm -rf "$TMP_WORK" "$TMP_CACHE"' EXIT
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid \
            -v "${TMP_WORK}:/work" \
            -v "${TMP_CACHE}:/cache" \
            "vpp-smoke:${{ steps.meta.outputs.version }}" --version
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid \
            -v "${TMP_WORK}:/work" \
            -v "${TMP_CACHE}:/cache" \
            "vpp-smoke:${{ steps.meta.outputs.version }}" demo --no-ui --output-dir /work/demo_out --db /work/.vpp-demo.db
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid \
            -v "${TMP_WORK}:/work:ro" \
            -v "${TMP_CACHE}:/cache" \
            "vpp-smoke:${{ steps.meta.outputs.version }}" verify /work/demo_out/runmanifest.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch OCI image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VPP_VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Attest OCI image build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.meta.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
