# Copy-pasteable 3-minute GitLab CI Pipeline: Trivy SARIF + VulnParse-Pin (vpp)
# Include or copy into .gitlab-ci.yml
# Reference configs to copy/customize at repo root:
#   - examples/configs/assets.example.yaml -> assets.yaml
#   - examples/configs/decisions.example.yaml -> decisions.yaml
stages:
  - security

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  VPP_DB_PATH: ".vpp.db"
  VPP_OUT_DIR: "out"
  VPP_ASSETS_FILE: "assets.yaml"
  VPP_DECISIONS_FILE: "decisions.yaml"

vpp_trivy_gate:
  stage: security
  image: python:3.12-slim

  cache:
    key: "vpp-db-$CI_DEFAULT_BRANCH"
    fallback_keys:
      - "vpp-db-$CI_COMMIT_REF_SLUG"
    paths:
      - .vpp.db
      - .cache/pip
    policy: pull-push

  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - python -m pip install --upgrade pip
    - pip install "vulnparse-pin>=2.0.0"

  script:
    - mkdir -p "$VPP_OUT_DIR"
    # Scan repository filesystem (swap for `trivy image ...` to scan built images)
    - trivy fs . --scanners vuln,misconfig --format sarif --output trivy.sarif
    - |
      vpp scan trivy.sarif \
        --assets "$VPP_ASSETS_FILE" \
        --decisions "$VPP_DECISIONS_FILE" \
        --profile bod-26-04 \
        --db "$VPP_DB_PATH" \
        --output-dossier "$VPP_OUT_DIR/dossier" \
        --output-runmanifest "$VPP_OUT_DIR/runmanifest.json"
    - vpp verify "$VPP_OUT_DIR/runmanifest.json"
    - |
      vpp export \
        --db "$VPP_DB_PATH" \
        --format roadmap-html \
        --output "$VPP_OUT_DIR/executive_roadmap.html"
    - |
      vpp export \
        --db "$VPP_DB_PATH" \
        --format roadmap-md \
        --output "$VPP_OUT_DIR/executive_roadmap.md"
    - |
      vpp diff \
        --db "$VPP_DB_PATH" \
        --decisions "$VPP_DECISIONS_FILE" \
        --fail-on stale-assumption \
        --output-pr-comment "$VPP_OUT_DIR/pr_comment.md" \
        --output-md "$VPP_OUT_DIR/diff_report.md"

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/
      - trivy.sarif
