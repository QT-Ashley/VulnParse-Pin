# Copy-pasteable 3-minute CI Security Gate: Trivy SARIF + VulnParse-Pin (vpp)
# Place in .github/workflows/vpp-security-gate.yml
# Reference configs to copy/customize at repo root:
#   - examples/configs/assets.example.yaml -> assets.yaml
#   - examples/configs/decisions.example.yaml -> decisions.yaml
name: VulnParse-Pin Security Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trivy-vpp-gate:
    name: Trivy SARIF + vpp Priority & Stale-Assumption Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Trivy and VulnParse-Pin
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          python -m pip install --upgrade pip
          pip install "vulnparse-pin>=2.0.0"

      - name: Scan repository to Trivy SARIF
        # For container images, replace `trivy fs .` with:
        #   trivy image --format sarif --output trivy.sarif ghcr.io/org/app:${{ github.sha }}
        run: |
          trivy fs . \
            --scanners vuln,misconfig \
            --format sarif \
            --output trivy.sarif

      - name: Restore .vpp.db workspace cache for diffing
        uses: actions/cache@v4
        with:
          path: .vpp.db
          key: vpp-db-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            vpp-db-${{ github.base_ref || github.ref_name }}-
            vpp-db-

      - name: Run vpp scan (BOD 26-04 SSVC + Decision Defense Dossier + RunManifest)
        # Copy examples/configs/assets.example.yaml -> assets.yaml and
        # examples/configs/decisions.example.yaml -> decisions.yaml (or adjust paths below).
        run: |
          mkdir -p out
          vpp scan trivy.sarif \
            --assets assets.yaml \
            --decisions decisions.yaml \
            --profile bod-26-04 \
            --db .vpp.db \
            --output-dossier out/dossier \
            --output-runmanifest out/runmanifest.json

      - name: Verify RunManifest integrity (read-only)
        run: |
          vpp verify out/runmanifest.json

      - name: Run vpp diff stale-assumption & priority gate
        run: |
          vpp diff \
            --db .vpp.db \
            --decisions decisions.yaml \
            --fail-on stale-assumption \
            --output-pr-comment out/pr_comment.md

      - name: Post PR diff & stale-assumption comment
        if: always() && github.event_name == 'pull_request' && hashFiles('out/pr_comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- vpp-diff-report -->';
            const body = `${marker}\n${fs.readFileSync('out/pr_comment.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload HTML Decision Defense Dossier, RunManifest & diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpp-decision-defense-dossier
          path: |
            out/
            trivy.sarif
          retention-days: 30
