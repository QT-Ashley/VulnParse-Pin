# Hardened Non-Root Docker Compose Stack for VulnParse-Pin v2.0.0
#
# Build locally from examples/deploy/Dockerfile first:
#   docker compose -f examples/deploy/docker-compose.yml build
#
# Usage:
#   docker compose -f examples/deploy/docker-compose.yml run --rm vpp-scan
#   docker compose -f examples/deploy/docker-compose.yml run --rm vpp-drift
#   docker compose -f examples/deploy/docker-compose.yml --profile ui run --rm vpp-ui
#
# Note: Official GHCR Cosign-signed OCI images are planned for Phase 2 in ROADMAP.md.

x-vpp-common: &vpp-common
  build:
    context: ../..
    dockerfile: examples/deploy/Dockerfile
  image: vulnparse-pin:local
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  working_dir: /work
  environment:
    HOME: /work
    XDG_DATA_HOME: /cache/data
    XDG_CONFIG_HOME: /cache/config
    XDG_CACHE_HOME: /cache/xdg
    TMPDIR: /tmp
    # Provide strong secrets via .env or secret manager in production
    VP_FEED_CACHE_HMAC_KEY: "${VP_FEED_CACHE_HMAC_KEY:-}"
    VP_SQLITE_HMAC_KEY: "${VP_SQLITE_HMAC_KEY:-}"
    VP_WEBHOOK_HMAC_KEY: "${VP_WEBHOOK_HMAC_KEY:-}"
  volumes:
    - ./work:/work
    - vpp-cache:/cache

services:
  vpp-scan:
    <<: *vpp-common
    command:
      - scan
      - /work/scans/trivy.sarif
      - --assets
      - /work/assets.yaml
      - --decisions
      - /work/decisions.yaml
      - --profile
      - bod-26-04
      - --db
      - /work/.vpp.db
      - --output-dossier
      - /work/out/dossier
      - --output-runmanifest
      - /work/out/runmanifest.json

  vpp-drift:
    <<: *vpp-common
    entrypoint: ["/bin/bash", "-euo", "pipefail", "-c"]
    command:
      - |
        vpp intel sync --feed kev
        vpp intel sync --feed epss
        vpp diff \
          --db /work/.vpp.db \
          --decisions /work/decisions.yaml \
          --fail-on stale-assumption \
          --output-md /work/out/drift_report.md \
          --output-json /work/out/drift_report.json

  vpp-ui:
    <<: *vpp-common
    profiles: ["ui"]
    stdin_open: true
    tty: true
    environment:
      HOME: /work
      XDG_DATA_HOME: /cache/data
      XDG_CONFIG_HOME: /cache/config
      XDG_CACHE_HOME: /cache/xdg
      TMPDIR: /tmp
      TERM: xterm-256color
    command:
      - ui
      - --db
      - /work/.vpp.db
      - --decisions
      - /work/decisions.yaml
      - --output-dir
      - /work/out

volumes:
  vpp-cache:
